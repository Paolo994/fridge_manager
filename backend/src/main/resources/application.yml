server:
  port: 8080

spring:
  application:
    name: fridge-manager
  datasource:
    # Database H2 su file: parte senza installare nulla. Per PostgreSQL usa il profilo "postgres".
    url: jdbc:h2:file:./data/fridgedb;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  h2:
    console:
      enabled: false

app:
  jwt:
    # In produzione impostare JWT_SECRET (almeno 32 caratteri).
    secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me-0123456789}
    expiration-minutes: 1440
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  expiry:
    # Quanti giorni prima della scadenza inviare l'avviso
    warning-days: 2
    # Controllo ogni giorno alle 08:00
    cron: "0 0 8 * * *"
  ai:
    # Chiave da console.anthropic.com. Se manca, le funzioni IA rispondono 503 e il resto dell'app funziona.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-5-5}
