server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Foto fino a 10 MB (come il limite del backend)
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host conserva la porta (es. 192.168.0.57:3000): così Spring vede la richiesta
        # come same-origin e non applica il controllo CORS, da qualunque indirizzo si apra l'app.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Le chiamate all'IA (foto, assistente) possono durare decine di secondi
        proxy_read_timeout 300s;
    }

    # Asset con hash nel nome: cache lunga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single page app: ogni altra rotta restituisce index.html
    location / {
        try_files $uri /index.html;
    }
}
